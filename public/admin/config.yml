backend:
  name: github
  repo: itsghostlan/dylan-portfolio
  branch: main
  base_url: __OAUTH_BASE_URL__

media_folder: public/images/uploads
public_folder: /images/uploads
site_url: __SITE_URL__

collections:
  - name: settings
    label: Settings
    files:
      - name: site_settings
        label: Site Settings
        file: public/content/site-settings.json
        format: json
        fields:
          - { label: Site Name, name: siteTitle, widget: string, required: false }
          - { label: Favicon, name: favicon, widget: image, required: false }
          - { label: Home Eyebrow, name: homeEyebrow, widget: string, required: false }
          - { label: Hero Title, name: heroHeading, widget: string, required: false }
          - { label: Hero Accent, name: heroAccent, widget: string, required: false }
          - { label: Hero Description, name: heroDescription, widget: text, required: false }
          - { label: About Heading, name: aboutHeading, widget: string, required: false }
          - { label: About Biography, name: aboutBio, widget: text, required: false }
          - { label: Experience, name: aboutExperience, widget: text, required: false }
          - label: Skills
            name: skills
            widget: list
            required: false
            field: { label: Skill, name: skill, widget: string, required: false }
          - { label: Contact Heading, name: contactHeading, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - label: Social Links
            name: socials
            widget: list
            required: false
            fields:
              - { label: Name, name: label, widget: string, required: false }
              - { label: URL, name: url, widget: string, required: false }
          - { label: Copyright Year, name: copyrightYear, widget: string, required: false }
          - { label: Footer Note, name: footerNote, widget: string, required: false }

  - name: projects
    label: Projects
    folder: public/content/projects
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} — {{year}}"
    fields:
      - { label: Project Name, name: title, widget: string, required: false }
      - { label: Category, name: type, widget: string, required: false }
      - { label: Year, name: year, widget: string, required: false }
      - { label: Role, name: role, widget: string, required: false }
      - { label: Client, name: client, widget: string, required: false }
      - { label: Featured on Home, name: featured, widget: boolean, default: false, required: false }
      - label: Images
        name: images
        widget: list
        required: false
        field: { label: Image, name: image, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string, required: false }
      - label: Deliverables
        name: deliverables
        widget: list
        required: false
        field: { label: Deliverable, name: deliverable, widget: string, required: false }

  - name: work
    label: Work
    folder: public/content/work
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} — {{year}}"
    fields:
      - { label: Display Title, name: title, widget: string, required: false }
      - { label: Year, name: year, widget: string, required: false }
      - label: Media
        name: media
        widget: list
        required: false
        field:
          label: Image or Video
          name: file
          widget: file
          required: false
      - { label: Display Order, name: order, widget: number, value_type: int, min: 1, required: false }

  - name: posts
    label: Posts
    files:
      - name: posts
        label: Studio Notes
        file: public/content/posts.json
        format: json
        fields:
          - label: Posts
            name: posts
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: URL Slug, name: slug, widget: string, required: false }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", required: false }
              - { label: Excerpt, name: excerpt, widget: text, required: false }
              - { label: Body, name: body, widget: text, required: false }
              - { label: Published, name: published, widget: boolean, default: false, required: false }
